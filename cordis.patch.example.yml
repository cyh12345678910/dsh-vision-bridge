# cordis.patch.yml — vision-bridge 宿主级插件配置示例
#
# 将此文件内容追加到 $DSH_HOME/cordis.patch.yml（不存在则新建）。
# 保存即热加载，无需重启。禁用：将该行下加 `disabled: true`。
#
# 路径中的 {USERPROFILE} 需替换为你的实际用户目录，
# 或使用 file:// 协议的绝对路径。

# ── 后端：SiliconFlow + DeepSeek-OCR（推荐，免费额度，1-2秒响应）─────────
# SiliconFlow 注册送 14 元额度，DeepSeek-OCR 是免费的 OCR 模型。
# 注册地址：https://cloud.siliconflow.cn

- insert:
  - id: vision-bridge
    name: "file:///C:/Users/你的用户名/.dsh/plugins/vision-bridge-entry.mjs?v=1"
    config:
      backend: api
      apiKey: "sk-你的SiliconFlow密钥"       # https://cloud.siliconflow.cn → API 密钥
      apiBase: "https://api.siliconflow.cn/v1"
      apiModel: "deepseek-ai/DeepSeek-OCR"   # 免费 OCR 模型，1-2秒响应
      timeoutMs: 30000
      cacheMaxEntries: 200

# ── 后端：OpenAI Vision API ──────────────────────────────────────────────
